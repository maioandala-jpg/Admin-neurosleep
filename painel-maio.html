<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAIO — Admin de Conteúdos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0d0d;
    --surface:  #161616;
    --border:   #2a2a2a;
    --muted:    #3a3a3a;
    --text:     #e8e8e8;
    --dim:      #888;
    --accent:   #ff4d00;
    --danger:   #c0392b;
    --danger-h: #e74c3c;
    --green:    #27ae60;
    --radius:   6px;
    --mono:     'Courier New', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 32px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header h1 {
    font-size: 22px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  header span {
    color: var(--dim);
    font-size: 12px;
  }

  .container { max-width: 760px; margin: 0 auto; }

  /* FORM */
  .form-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 40px;
  }

  .form-section h2 {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 20px;
  }

  .field { margin-bottom: 16px; }

  .field-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="url"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }

  input[type="text"]:focus,
  input[type="url"]:focus {
    border-color: var(--accent);
  }

  /* PREVIEW DA MINIATURA */
  .thumb-preview {
    margin-top: 10px;
    width: 160px;
    height: 90px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg) center/cover no-repeat;
    display: none;
  }
  .thumb-preview.show { display: block; }

  /* BOTÃO PUBLICAR */
  .btn-publish {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s;
  }

  .btn-publish:hover { opacity: 0.85; }
  .btn-publish:active { opacity: 0.7; }
  .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--green);
    color: #fff;
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: var(--radius);
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.25s;
    pointer-events: none;
    z-index: 999;
    max-width: 80vw;
  }

  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { background: var(--danger); }

  /* LISTA */
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .list-header h2 {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }

  #count {
    font-size: 11px;
    color: var(--dim);
    background: var(--muted);
    padding: 2px 8px;
    border-radius: 20px;
  }

  #empty-state, #error-state {
    text-align: center;
    color: var(--dim);
    padding: 40px 0;
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  #error-state { border-color: var(--danger); color: var(--danger-h); }

  /* CARD */
  .news-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-thumb {
    width: 96px;
    height: 60px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--muted);
  }

  .card-thumb-placeholder {
    width: 96px;
    height: 60px;
    border-radius: 4px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--dim);
  }

  .card-body { flex: 1; min-width: 0; }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .card-date { font-size: 10px; color: var(--dim); }

  .card-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-link {
    font-size: 11px;
    color: var(--dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
    text-decoration: none;
  }
  .card-link:hover { color: var(--accent); }

  .card-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-delete {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn-delete:hover {
    border-color: var(--danger-h);
    color: var(--danger-h);
  }

  /* COMPARTILHAR */
  .share-row {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }

  .btn-share {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--dim);
    font-size: 13px;
    width: 26px;
    height: 26px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .btn-share.fb:hover { border-color: #1877F2; color: #1877F2; }
  .btn-share.ig:hover { border-color: #E1306C; color: #E1306C; }
  .btn-share.wa:hover { border-color: #25D366; color: #25D366; }

  .site-link {
    font-size: 10px;
    color: var(--dim);
    text-decoration: none;
    text-align: right;
    white-space: nowrap;
  }
  .site-link:hover { color: var(--accent); }
</style>
</head>
<body>

<div class="container">

  <header>
    <h1>MAIO</h1>
    <span>// painel admin — conteúdos</span>
    <div style="margin-top:8px;display:flex;align-items:center;gap:12px;">
      <a href="andala.html" style="font-size:12px;color:var(--muted,#8A82AD);text-decoration:none;">← Andala</a>
      <button onclick="andalaLogout()" style="background:none;border:1px solid #333;color:inherit;font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;">Sair</button>
    </div>
  </header>

  <!-- FORMULÁRIO -->
  <div class="form-section">
    <h2>// novo conteúdo</h2>

    <div class="field">
      <label>Link do vídeo (YouTube)</label>
      <input type="url" id="f-link" placeholder="https://www.youtube.com/watch?v=..." oninput="atualizarPreview()">
      <div class="field-hint">Aceita links no formato watch, youtu.be ou shorts.</div>
      <div class="thumb-preview" id="thumb-preview"></div>
    </div>

    <div class="field">
      <label>Título</label>
      <input type="text" id="f-titulo" placeholder="Ex: Como responder perguntas difíceis">
    </div>

    <div class="field">
      <label>Imagem de capa <span style="color:var(--muted)">(opcional)</span></label>
      <input type="url" id="f-imagem" placeholder="https://... (deixe vazio para usar a miniatura do YouTube)" oninput="atualizarPreview()">
    </div>

    <button class="btn-publish" id="btn-publicar" onclick="publicar()">▶ Publicar conteúdo</button>
  </div>

  <!-- LISTA -->
  <div class="list-header">
    <div style="display:flex;align-items:center;gap:10px">
      <h2>// publicados</h2>
      <span id="count">0</span>
    </div>
  </div>

  <div id="lista"><div id="empty-state">Carregando…</div></div>

</div>

<div id="toast">✓ Publicado</div>

<script>
// ══════════════════════════════════════════════════════
// CONFIGURAÇÃO — FIREBASE REALTIME DATABASE
// ══════════════════════════════════════════════════════
const DB_URL = 'https://aether-2585d-default-rtdb.firebaseio.com';
const PATH   = 'videos_admin';
const SITE_URL = 'https://maiotreino.vercel.app/'; // site público onde o conteúdo é exibido
// IMPORTANTE: as regras do Realtime Database precisam permitir leitura/escrita
// pública neste caminho (ou você precisa adicionar autenticação depois).
// Regra mínima sugerida no console do Firebase:
// { "rules": { "videos_admin": { ".read": true, ".write": true } } }

function extrairYoutubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function atualizarPreview() {
  const link   = document.getElementById('f-link').value.trim();
  const imagem = document.getElementById('f-imagem').value.trim();
  const prev   = document.getElementById('thumb-preview');
  const vid    = extrairYoutubeId(link);
  const url    = imagem || (vid ? `https://img.youtube.com/vi/${vid}/hqdefault.jpg` : '');

  if (url) {
    prev.style.backgroundImage = `url('${url}')`;
    prev.classList.add('show');
  } else {
    prev.classList.remove('show');
  }
}

async function carregar() {
  const resp = await fetch(`${DB_URL}/${PATH}.json`);
  if (!resp.ok) throw new Error('Falha ao ler o Firebase');
  const dados = await resp.json();
  return dados || {};
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtData(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' +
         d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

async function renderizar() {
  const lista = document.getElementById('lista');
  const count = document.getElementById('count');

  try {
    const dados  = await carregar();
    const chaves = Object.keys(dados);
    count.textContent = chaves.length;

    if (!chaves.length) {
      lista.innerHTML = '<div id="empty-state">Nenhum conteúdo publicado ainda.</div>';
      return;
    }

    chaves.sort((a, b) => (dados[b].ts || 0) - (dados[a].ts || 0));

    lista.innerHTML = chaves.map(chave => {
      const item  = dados[chave];
      const vid   = item.videoId || extrairYoutubeId(item.link);
      const thumb = item.imagem || (vid ? `https://img.youtube.com/vi/${vid}/hqdefault.jpg` : '');
      const thumbTag = thumb
        ? `<img class="card-thumb" src="${escHtml(thumb)}" alt="" onerror="this.style.display='none'">`
        : `<div class="card-thumb-placeholder">🎬</div>`;
      const linkDireto = `${SITE_URL}?conteudo=${encodeURIComponent(chave)}`;
      return `
      <div class="news-card">
        ${thumbTag}
        <div class="card-body">
          <div class="card-meta">
            <span class="card-date">${fmtData(item.ts)}</span>
          </div>
          <div class="card-title">${escHtml(item.titulo || 'Sem título')}</div>
          <a class="card-link" href="${escHtml(item.link)}" target="_blank" rel="noopener">${escHtml(item.link)}</a>
        </div>
        <div class="card-actions">
          <button class="btn-delete" onclick="apagar('${chave}')">Apagar</button>
          <div class="share-row">
            <button class="btn-share fb" data-rede="facebook" data-link="${linkDireto}" data-titulo="${escHtml(item.titulo || '')}" title="Compartilhar no Facebook">📘</button>
            <button class="btn-share ig" data-rede="instagram" data-link="${linkDireto}" data-titulo="${escHtml(item.titulo || '')}" title="Compartilhar no Instagram">📷</button>
            <button class="btn-share wa" data-rede="whatsapp" data-link="${linkDireto}" data-titulo="${escHtml(item.titulo || '')}" title="Compartilhar no WhatsApp">💬</button>
          </div>
          <a class="site-link" href="${linkDireto}" target="_blank" rel="noopener">🔗 Ver no site</a>
        </div>
      </div>`;
    }).join('');
  } catch (err) {
    lista.innerHTML = '<div id="error-state">⚠️ Não foi possível conectar ao Firebase. Verifique as regras do banco e sua conexão.</div>';
    console.error(err);
  }
}

async function publicar() {
  const link    = document.getElementById('f-link').value.trim();
  const titulo  = document.getElementById('f-titulo').value.trim();
  const imagem  = document.getElementById('f-imagem').value.trim();
  const btn     = document.getElementById('btn-publicar');

  if (!link)   { alert('Cole o link do vídeo do YouTube.'); return; }
  const videoId = extrairYoutubeId(link);
  if (!videoId) { alert('Link do YouTube inválido. Use o formato watch, youtu.be ou shorts.'); return; }
  if (!titulo) { alert('Preencha o título.'); return; }

  const payload = {
    titulo,
    link,
    imagem: imagem || `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
    videoId,
    ts: Date.now()
  };

  btn.disabled = true;
  try {
    const resp = await fetch(`${DB_URL}/${PATH}.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) throw new Error('Falha ao publicar');

    document.getElementById('f-link').value   = '';
    document.getElementById('f-titulo').value = '';
    document.getElementById('f-imagem').value = '';
    document.getElementById('thumb-preview').classList.remove('show');

    await renderizar();
    mostrarToast('✓ Conteúdo publicado');
  } catch (err) {
    mostrarToast('✕ Erro ao publicar. Verifique as regras do Firebase.', true);
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

async function apagar(chave) {
  try {
    const resp = await fetch(`${DB_URL}/${PATH}/${chave}.json`, { method: 'DELETE' });
    if (!resp.ok) throw new Error('Falha ao apagar');
    await renderizar();
    mostrarToast('✓ Conteúdo apagado');
  } catch (err) {
    mostrarToast('✕ Erro ao apagar', true);
    console.error(err);
  }
}

let toastTimer;
function mostrarToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ══════════════════════════════════════════════════════
// COMPARTILHAR — Facebook, Instagram, WhatsApp
// ══════════════════════════════════════════════════════
function compartilhar(rede, url, titulo) {
  const texto = titulo || '';
  const linkValido = url && /^https?:\/\//i.test(url);

  if (rede === 'whatsapp') {
    const msg = linkValido ? `${texto}\n${url}` : texto;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  } else if (rede === 'facebook') {
    if (linkValido) {
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank', 'noopener,width=600,height=520');
    } else {
      copiarParaCompartilhar(texto, 'https://www.facebook.com/');
    }
  } else if (rede === 'instagram') {
    // Instagram não tem intent web de compartilhamento de link — copia o texto/link
    // e abre o Instagram para o usuário colar (nos Stories, bio ou DM).
    copiarParaCompartilhar(linkValido ? `${texto}\n${url}` : texto, 'https://www.instagram.com/');
  }
}

function copiarParaCompartilhar(texto, destino) {
  if (navigator.clipboard && texto) {
    navigator.clipboard.writeText(texto)
      .then(() => mostrarToast('Link copiado! Cole ao compartilhar.'))
      .catch(() => {});
  }
  window.open(destino, '_blank');
}

// Delegação de evento para os botões de compartilhar (funciona mesmo após re-renderizar a lista)
document.addEventListener('click', function (e) {
  const btn = e.target.closest('.btn-share');
  if (!btn) return;
  compartilhar(btn.dataset.rede, btn.dataset.link || '', btn.dataset.titulo || '');
});

// Init
renderizar();
</script>
</body>
</html>
