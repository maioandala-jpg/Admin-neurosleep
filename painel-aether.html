<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AETHER — Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F5;--card:#fff;--ink:#1D2B2A;--muted:#5C6E6B;--line:#DCE6E2;--brand:#14594F;--cta:#E8A33D;--danger:#B3382C;font-family:'Nunito Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A18;--card:#172623;--ink:#EAF2EF;--muted:#9DB3AE;--line:#27403B;--brand:#4FB3A2;--danger:#F08A7E}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2{font-family:'Lora',serif}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;height:60px;border-bottom:1px solid var(--line);margin-bottom:24px}
.top h1{font-size:21px;color:var(--brand)}
.top div{display:flex;gap:14px;font-size:14px;font-weight:600}
a,.link{color:var(--brand);background:none;border:0;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px}
.box h2{font-size:20px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--cta);color:#2B1B00;font-weight:700;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);margin-top:8px}
.btn:disabled{opacity:.6}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img,.item .ph{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--brand);flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted)}
.item button{padding:7px 10px}
.del{color:var(--danger)}
#prev{display:none;margin-top:10px;max-height:150px;border-radius:10px}
.hint{color:var(--muted);font-size:14px;margin-bottom:12px}
.linkbox{border-color:var(--brand)}
.open{display:block;text-align:center;margin-top:14px;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.empty{color:var(--muted);padding:14px 0}
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<div id="lock" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99">A verificar acesso…</div>

<div class="wrap">
  <div class="top"><h1>AETHER · Painel</h1><div><a href="index.html" target="_blank">Ver loja</a><button class="link" id="sair">Sair</button></div></div>

  <div class="box">
    <h2 id="formTitle">Novo produto</h2>
    <label for="titulo">Título</label>
    <input id="titulo" placeholder="Ex: Mente de Vencedor">
    <label for="subtitulo">Frase curta</label>
    <input id="subtitulo" placeholder="Ex: Hábitos que mudam resultados">
    <label for="corpo">Descrição</label>
    <textarea id="corpo" placeholder="O que a pessoa vai aprender ou sentir ao ler?"></textarea>
    <div class="row">
      <div><label for="categoria">Categoria</label>
        <select id="categoria"><option value="">Escolher…</option>
          <option>BÍBLICO</option><option>MENTALIDADE</option><option>ROMANCE &amp; INGLÊS</option></select></div>
      <div><label for="preco">Preço</label><input id="preco" placeholder="250 MT"></div>
    </div>
    <label for="imagem">Link da capa (opcional)</label>
    <input id="imagem" type="url" placeholder="https://i.ibb.co/…">
    <img id="prev" alt="Pré-visualização da capa">
    <button class="btn" id="salvar">Publicar produto</button>
    <button class="btn ghost" id="cancelar" style="display:none">Cancelar edição</button>
  </div>

  <div class="box linkbox" id="linkBox" style="display:none">
    <h2>Link do produto pronto para partilhar</h2>
    <p class="hint">Quem tocar neste link abre directamente o ebook na tua loja. Cola-o no vídeo, no grupo, no status ou em qualquer rede.</p>
    <input id="linkOut" readonly aria-label="Link do produto">
    <div class="row" style="margin-top:12px">
      <button class="btn" id="cpLink" style="margin-top:0">Copiar link</button>
      <button class="btn ghost" id="shLink" style="margin-top:0">Partilhar</button>
    </div>
    <a class="open" id="abrirLoja" target="_blank" rel="noopener">Abrir na loja para conferir</a>
  </div>

  <div class="box">
    <h2>Os teus produtos (<span id="n">0</span>)</h2>
    <div id="lista"><div class="empty">A carregar…</div></div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
/* acesso — igual ao painel anterior */
firebase.initializeApp({
  apiKey:'AIzaSyBGz09UMg2Grh0JfqJw0R_b6CXmZddS074',authDomain:'neurosleep-a43d0.firebaseapp.com',
  databaseURL:'https://neurosleep-a43d0-default-rtdb.firebaseio.com',projectId:'neurosleep-a43d0',
  messagingSenderId:'549312489447',appId:'1:549312489447:web:1428fbef235792197aff42'});
firebase.auth().onAuthStateChanged(u => { if(u) document.getElementById('lock').remove(); else location.href='andala.html'; });
document.getElementById('sair').onclick = () => firebase.auth().signOut().then(() => location.href='andala.html');

/* Endereço da tua loja. Se a loja estiver noutro endereço, escreve-o aqui, por exemplo 'https://aether.vercel.app/' */
const LOJA = new URL('index.html', location.href).href;
const linkDe = ts => `${LOJA.split('?')[0]}?p=${ts}`;
const DB = 'https://aether-2585d-default-rtdb.firebaseio.com/produtos';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const campos = ['titulo','subtitulo','corpo','categoria','preco','imagem'];
let itens = [], editando = null, editTs = null;

function aviso(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); setTimeout(()=>e.classList.remove('on'),2200); }

async function carregar(){
  try{
    const d = await (await fetch(DB + '.json')).json();
    itens = d ? Object.entries(d).filter(([k,p]) => p && p.titulo).map(([k,p]) => ({...p,_k:k})).sort((a,b)=>b.ts-a.ts) : [];
  }catch(e){ aviso('Sem ligação. Tenta de novo.'); }
  desenhar();
}

function desenhar(){
  $('#n').textContent = itens.length;
  $('#lista').innerHTML = itens.length ? itens.map((p,i) => `<div class="item">
    ${p.imagem ? `<img src="${esc(p.imagem)}" alt="">` : '<div class="ph"></div>'}
    <div class="t"><b>${esc(p.titulo)}</b><small>${esc(p.categoria)} · ${esc(p.preco)}</small></div>
    <button class="link" data-l="${i}">Link</button><button class="link" data-e="${i}">Editar</button><button class="link del" data-d="${i}">Apagar</button></div>`).join('')
    : '<div class="empty">Ainda não tens produtos. Preenche o formulário acima e publica o primeiro.</div>';
}

function limpar(){
  campos.forEach(c => $('#'+c).value = ''); editando = null;
  $('#formTitle').textContent = 'Novo produto'; $('#salvar').textContent = 'Publicar produto';
  $('#cancelar').style.display = 'none'; $('#prev').style.display = 'none'; editTs = null;
}

$('#imagem').addEventListener('input', e => { const v=e.target.value.trim(); $('#prev').src=v; $('#prev').style.display=v?'block':'none'; });

$('#salvar').onclick = async () => {
  const d = {}; campos.forEach(c => d[c] = $('#'+c).value.trim());
  if(!d.titulo || !d.categoria || !d.preco){ aviso('Preenche título, categoria e preço.'); return; }
  const b = $('#salvar'); b.disabled = true;
  try{
    const ts = editando ? editTs : Date.now();
    const r = editando
      ? await fetch(`${DB}/${editando}.json`, {method:'PATCH', body:JSON.stringify(d)})
      : await fetch(DB + '.json', {method:'POST', body:JSON.stringify({...d, ts})});
    if(!r.ok) throw 0;
    aviso(editando ? 'Alterações guardadas' : 'Produto publicado');
    limpar(); await carregar(); mostrarLink(ts);
  }catch(e){ aviso('Não foi possível guardar. Tenta de novo.'); }
  b.disabled = false;
};

$('#cancelar').onclick = limpar;

let linkAtual = '';
function mostrarLink(ts){
  linkAtual = linkDe(ts);
  $('#linkOut').value = linkAtual; $('#abrirLoja').href = linkAtual;
  $('#linkBox').style.display = 'block';
  $('#linkBox').scrollIntoView({behavior:'smooth', block:'center'});
}
async function copiar(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const i=$('#linkOut'); i.value=t; i.select(); document.execCommand('copy'); }
  aviso('Link copiado');
}
$('#cpLink').onclick = () => copiar(linkAtual);
$('#linkOut').onclick = e => e.target.select();
$('#shLink').onclick = async () => {
  if(navigator.share){ try{ await navigator.share({title:'AETHER', text:'Vê este ebook:', url:linkAtual}); return; }catch(e){ if(e.name==='AbortError') return; } }
  copiar(linkAtual);
};

$('#lista').addEventListener('click', async e => {
  const ed = e.target.dataset.e, dl = e.target.dataset.d, lk = e.target.dataset.l;
  if(lk !== undefined){ mostrarLink(itens[lk].ts); return; }
  if(ed !== undefined){
    const p = itens[ed]; campos.forEach(c => $('#'+c).value = p[c] || ''); editando = p._k; editTs = p.ts;
    $('#formTitle').textContent = 'Editar produto'; $('#salvar').textContent = 'Guardar alterações';
    $('#cancelar').style.display = 'block'; $('#imagem').dispatchEvent(new Event('input'));
    scrollTo({top:0,behavior:'smooth'});
  }
  if(dl !== undefined && confirm(`Apagar "${itens[dl].titulo}"?`)){
    const r = await fetch(`${DB}/${itens[dl]._k}.json`, {method:'DELETE'});
    aviso(r.ok ? 'Produto apagado' : 'Não foi possível apagar'); carregar();
  }
});
carregar();
</script>
</body>
</html>
